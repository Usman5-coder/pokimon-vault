#preloader.err .pl-bar{display:none}#preloader.err .pl-msg{color:#f2efe8}
@keyframes plf{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.03)}}
@keyframes pld{to{stroke-dashoffset:0}}
@keyframes plg{to{opacity:1}}
